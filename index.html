<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bred.</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="bred." />
  <meta property="og:description" content="just a loaf of bred." />
  <meta property="og:image" content="/og-banner.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/og-banner.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* CRT scanlines — above canvas, below UI (z-index 50) */
    #crt {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background:
        repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.04) 2px,
          rgba(0, 0, 0, 0.04) 4px),
        repeating-linear-gradient(90deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.015) 2px,
          rgba(0, 0, 0, 0.015) 3px);
      mix-blend-mode: multiply;
    }

    /* Vignette — above canvas, below UI (z-index 51) */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 51;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
    }
  </style>
</head>

<body>
  <div id="crt"></div>
  <div id="vignette"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
